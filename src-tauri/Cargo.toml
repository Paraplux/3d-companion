[package]
name = "three_d_library"
version = "0.1.0"
description = "Desktop companion for 3D printing workflows"
authors = ["you"]
edition = "2021"

[lib]
name = "three_d_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
walkdir = "2.5.0"
notify = { version = "8.2.0", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.26.0", features = ["v4"] }
zip = "2.2.2"
quick-xml = "0.37.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
webp = "0.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
url = "2"
