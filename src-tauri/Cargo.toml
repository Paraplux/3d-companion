[package]
name = "three_d_library"
version = "0.1.0"
description = "Desktop companion for 3D printing workflows"
authors = ["you"]
edition = "2021"

[lib]
name = "three_d_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
walkdir = "2.5.0"
notify = { version = "8.2.0", features = ["serde"] }
